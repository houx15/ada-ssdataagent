[project]
name = "ssbench"
version = "0.1.0"
description = "Independent reproduction & extension of SSDataBench (GSS + CFPS)"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "openai>=1.60",
    "pandas>=2.2,<3",
    "numpy>=1.26",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "autograd>=1.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ssbench"]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true
