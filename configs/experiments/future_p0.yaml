name: future_p0_multimodel_v1
dataset: cfps
protocol_version: 1
access_date: 2026-08-29
population_n: 1000
seeds: [4101, 4102, 4103]
conditions:
  - direct
  - full
evaluator:
  bootstrap_seeds: [9101, 9102, 9103, 9104, 9105]
  B: 100
  sample_n: 500
elicitation:
  ada_personas: 1000
  probe_reps: 6
  concurrency: 24
# Leave room for the paid channel preflight already recorded this week.
budget_usd: 199.8

providers:
  local:
    kind: local
  openrouter:
    kind: openrouter
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    extra_body:
      provider:
        data_collection: deny
        require_parameters: true
        sort: price
      # Population generation and elicitation require concise structured JSON;
      # disable model-default long reasoning so models share the same protocol
      # and reasoning tokens do not consume the weekly budget invisibly.
      reasoning:
        enabled: false
    # The paid matrix sends only parameters supported by every selected
    # OpenRouter model. temperature/top_p remain local-baseline parameters.

# Prices are USD per million tokens from OpenRouter's official model catalog
# on access_date. The requested id and resolved model returned by every call
# are both recorded, so provider-side version resolution remains auditable.
models:
  local_glm52:
    provider: local
    model: glm-5.2
    canonical_slug: local/glm-5.2
    category: current_local_baseline
    input_usd_per_m: 0
    output_usd_per_m: 0
  gemini31_flash_lite:
    provider: openrouter
    model: google/gemini-3.1-flash-lite
    canonical_slug: google/gemini-3.1-flash-lite-20260507
    category: strong_closed_efficient
    input_usd_per_m: 0.25
    output_usd_per_m: 1.50
  deepseek_v4_flash:
    provider: openrouter
    model: deepseek/deepseek-v4-flash
    canonical_slug: deepseek/deepseek-v4-flash-20260423
    category: open_weight
    input_usd_per_m: 0.084
    output_usd_per_m: 0.168
  qwen38_flash:
    provider: openrouter
    model: qwen/qwen3.8-flash
    canonical_slug: qwen/qwen3.8-flash-20260826
    category: current_qwen_generation
    input_usd_per_m: 0.15
    output_usd_per_m: 0.47
